<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #060609;
  --surface:  #0c0c14;
  --s2:       #101020;
  --s3:       #14142a;
  --border:   #1e1e38;
  --border2:  #28284a;
  --text:     #c8c4e8;
  --soft:     #8884b0;
  --muted:    #3e3a60;
  --accent:   #8b72ff;
  --a-glow:   #8b72ff30;
  --teal:     #36d9b0;
  --rose:     #ff6b8a;
  --amber:    #ffb347;
  --serif:    'Cormorant Garamond', Georgia, serif;
  --mono:     'JetBrains Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 12px;
}

/* ════════════════════════════════════════════
   TOPBAR
════════════════════════════════════════════ */
#topbar {
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.brand-icon {
  width: 32px;
  height: 32px;
  position: relative;
  flex-shrink: 0;
}
.brand-icon svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.brand-orbit {
  animation: orbit 12s linear infinite;
  transform-origin: 16px 16px;
}
@keyframes orbit { to { transform: rotate(360deg); } }

.brand-text {
  line-height: 1.2;
}
.brand-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 1px;
  color: #e4e0ff;
  font-style: italic;
}
.brand-sub {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}

/* scenario input in topbar */
#scenario-wrap {
  flex: 1;
  position: relative;
  max-width: 520px;
}
#scenario-wrap::before {
  content: 'SCENARIO';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--muted);
  pointer-events: none;
  z-index: 1;
}
#sci {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 9px 12px 9px 84px;
  border-radius: 4px;
  outline: none;
  transition: border-color .2s, background .2s;
}
#sci:focus { border-color: var(--accent); background: var(--s3); }
#sci::placeholder { color: var(--muted); }

/* topbar right controls */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: auto;
}

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.ctrl-group label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 10px;
  background: var(--s2);
  height: 32px;
  display: flex;
  align-items: center;
  border-right: 1px solid var(--border);
  white-space: nowrap;
}
.ctrl-group select,
.ctrl-group input[type="number"] {
  background: var(--s2);
  border: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 0 10px;
  height: 32px;
  outline: none;
  cursor: pointer;
}
.ctrl-group select:focus,
.ctrl-group input:focus { background: var(--s3); }
#tni { width: 52px; text-align: center; }

/* agent count badge */
#agpill {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--soft);
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 20px;
  white-space: nowrap;
}

/* buttons */
.btn {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 7px 16px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .18s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: var(--accent);
  color: #06060a;
  border-color: var(--accent);
  font-weight: 500;
}
.btn-primary:hover { background: #7a60f0; border-color: #7a60f0; box-shadow: 0 0 20px var(--a-glow); }
.btn-ghost { background: transparent; color: var(--soft); border-color: var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.btn-teal { background: transparent; color: var(--teal); border-color: #36d9b030; }
.btn-teal:hover { background: #36d9b012; }
.btn-danger { background: transparent; color: var(--rose); border-color: #ff6b8a25; }
.btn-danger:hover { background: #ff6b8a10; }
.btn:disabled { opacity: .3; cursor: not-allowed; pointer-events: none; }
#rlb { font-size: 9px; color: var(--muted); white-space: nowrap; letter-spacing: 1px; }

/* ════════════════════════════════════════════
   MAIN LAYOUT
════════════════════════════════════════════ */
#main { display: flex; flex: 1; overflow: hidden; }

/* ════════════════════════════════════════════
   CANVAS
════════════════════════════════════════════ */
#cwrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* Atmospheric layers */
#cwrap::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 25%, #1a0d3a18 0%, transparent 60%),
    radial-gradient(ellipse 50% 45% at 80% 70%, #0a1a3a14 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 55% 50%, #0d1a1a0a 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Subtle grid */
#cwrap::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.18;
  pointer-events: none;
  z-index: 0;
}

#lsvg { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
#canvas { position: absolute; inset: 0; z-index: 3; }

/* corner labels */
.canvas-corner {
  position: absolute;
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.5;
  pointer-events: none;
  z-index: 4;
}
#cc-tl { top: 14px; left: 16px; }
#cc-tr { top: 14px; right: 16px; }
#cc-bl { bottom: 52px; left: 16px; }

/* ════════════════════════════════════════════
   AGENT BUBBLES
════════════════════════════════════════════ */
.ab {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 10;
  cursor: pointer;
  user-select: none;
  transition: filter .2s;
}
.ab:hover { filter: brightness(1.12); }
.ab:hover .bc { transform: scale(1.05); }
.ab.sel .bc {
  box-shadow: 0 0 0 2px var(--ac), 0 0 32px var(--ag) !important;
}

.bc {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 1.5px solid var(--ac);
  box-shadow: 0 0 20px var(--ag), inset 0 0 16px rgba(0,0,0,.55);
  background: radial-gradient(circle at 38% 30%, var(--al), var(--ad));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: box-shadow .3s, transform .2s;
}

.bav {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 1px 8px rgba(0,0,0,.5);
  pointer-events: none;
  font-style: italic;
}

.bdot {
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  background: var(--muted);
  transition: background .3s;
}
.bdot.running { background: var(--teal); animation: pulse 1.1s ease-in-out infinite; }
.bdot.done    { background: var(--accent); }
.bdot.error   { background: var(--rose); }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }

.bname {
  text-align: center;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ac);
  margin-top: 7px;
  opacity: 0.9;
}

/* awareness badge under name */
.baw {
  text-align: center;
  font-size: 7.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 2px;
  opacity: 0.5;
}

/* hover thought bubble */
.bth {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(12, 12, 22, 0.97);
  border: 1px solid var(--ac);
  border-radius: 8px 8px 8px 2px;
  padding: 10px 13px;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--soft);
  max-width: 220px;
  min-width: 160px;
  white-space: normal;
  pointer-events: none;
  opacity: 0;
  transition: opacity .22s, transform .22s;
  transform: translateX(-50%) translateY(4px);
  z-index: 30;
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
}
.ab:hover .bth,
.ab.sel .bth {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
/* small triangle */
.bth::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 18px;
  width: 10px;
  height: 6px;
  background: var(--ac);
  clip-path: polygon(0 0, 100% 0, 0 100%);
}

/* ════════════════════════════════════════════
   SIDE PANEL
════════════════════════════════════════════ */
#sp {
  width: 380px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  overflow: hidden;
}

/* Panel agent header */
#ph {
  padding: 0 20px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
  background: var(--s2);
}

#pn {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 300;
  font-style: italic;
  color: #e4e0ff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#pt {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 12px;
  background: var(--border);
  color: var(--muted);
  flex-shrink: 0;
  border: 1px solid var(--border);
}

/* panel tabs */
#panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ptab {
  flex: 1;
  padding: 9px 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .18s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: var(--mono);
}
.ptab:hover { color: var(--soft); }
.ptab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* script section */
#psw {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: none;
}
#psw.show { display: block; }
.slbl {
  font-size: 8px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
#psc {
  font-size: 11.5px;
  line-height: 1.8;
  color: var(--soft);
  font-style: italic;
  font-family: var(--serif);
}

/* story feed */
#pst {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  scroll-behavior: smooth;
}
#pst::-webkit-scrollbar { width: 3px; }
#pst::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.tb {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  animation: fadeSlide .35s ease;
  position: relative;
}
.tb:last-child { border-bottom: none; }
.tb::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--turn-color, var(--accent));
  opacity: 0;
  transition: opacity .3s;
}
.tb:hover::before { opacity: 0.6; }

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tn {
  font-size: 8px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--tnc, var(--accent));
  margin-bottom: 7px;
  opacity: .75;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tn::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--tnc, var(--accent));
  opacity: .15;
}
.tt {
  font-size: 12px;
  line-height: 1.95;
  color: #a8a4c8;
  font-family: var(--serif);
  font-weight: 300;
}

.pe {
  padding: 48px 24px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  line-height: 2;
}
.pe .ic {
  display: block;
  font-family: var(--serif);
  font-size: 42px;
  font-style: italic;
  margin-bottom: 16px;
  opacity: 0.15;
  color: var(--accent);
}

/* thinking dots */
.thk {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 18px 20px;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.da span {
  display: inline-block;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
  margin: 0 2px;
  animation: da 1.3s ease-in-out infinite;
}
.da span:nth-child(2) { animation-delay: .22s; }
.da span:nth-child(3) { animation-delay: .44s; }
@keyframes da {
  0%,80%,100% { transform: scale(.5); opacity: .3; }
  40% { transform: scale(1.1); opacity: 1; }
}

/* ════════════════════════════════════════════
   BOTTOM BAR
════════════════════════════════════════════ */
#bb {
  height: 38px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  background: var(--surface);
  flex-shrink: 0;
  z-index: 100;
}
#pw {
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
#pb {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  transition: width .9s ease;
  border-radius: 2px;
  position: relative;
}
#pb::after {
  content: '';
  position: absolute;
  right: 0; top: -2px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 8px var(--teal);
  opacity: 0;
  transition: opacity .3s;
}
#pb.active::after { opacity: 1; }

#sm {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  min-width: 200px;
  text-align: right;
}

/* ════════════════════════════════════════════
   FAB — ADD AGENT
════════════════════════════════════════════ */
#fab {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  background: var(--accent);
  color: #06060a;
  border: none;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 24px var(--a-glow), 0 2px 8px rgba(0,0,0,.4);
  transition: transform .2s, box-shadow .2s, background .2s;
}
#fab:hover {
  transform: translateX(-50%) translateY(-2px);
  box-shadow: 0 8px 32px var(--a-glow), 0 4px 12px rgba(0,0,0,.4);
}
#fab:disabled { opacity: .3; cursor: not-allowed; transform: translateX(-50%); box-shadow: none; }
#fab .fab-plus { font-size: 16px; line-height: 1; }

/* ════════════════════════════════════════════
   MODAL
════════════════════════════════════════════ */
.ov {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.8);
  backdrop-filter: blur(8px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
}
.ov.open { display: flex; }

.modal {
  background: var(--s2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  width: 520px;
  max-width: 95vw;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(139,114,255,.1);
  animation: modalIn .22s cubic-bezier(.34,1.56,.64,1);
}
.modal::-webkit-scrollbar { width: 3px; }
.modal::-webkit-scrollbar-thumb { background: var(--border2); }
@keyframes modalIn {
  from { opacity: 0; transform: scale(.94) translateY(-12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* modal header strip */
.modal-head {
  padding: 22px 24px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.modal-head h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 300;
  font-style: italic;
  color: #e4e0ff;
}
.modal-close {
  width: 28px; height: 28px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: var(--border2); color: var(--text); }

.modal-body { padding: 20px 24px 24px; }

/* preview bubble in modal */
#prev-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
#prev-ring {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 1.5px solid #9b6fff;
  box-shadow: 0 0 18px #9b6fff40, inset 0 0 12px rgba(0,0,0,.5);
  background: radial-gradient(circle at 38% 30%, #c4a8ff, #4a2ea0);
  display: flex; align-items: center; justify-content: center;
  transition: all .25s cubic-bezier(.34,1.56,.64,1);
}
#prev-letter {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 300;
  font-style: italic;
  color: rgba(255,255,255,.95);
}
#prev-name {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #9b6fff;
  transition: color .2s;
}
#prev-aw {
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

/* form fields */
.fld { margin-bottom: 16px; }
.fld:last-child { margin-bottom: 0; }
.fld-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.fld-label label {
  font-size: 8px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.fi {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 9px 12px;
  border-radius: 4px;
  outline: none;
  transition: border-color .2s, background .2s;
}
.fi:focus { border-color: var(--accent); background: var(--s3); }
.fi::placeholder { color: var(--muted); }
textarea.fi { resize: vertical; min-height: 90px; line-height: 1.7; font-family: var(--serif); font-size: 13px; font-weight: 300; }

/* name + color grid row */
.name-color-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: end;
  margin-bottom: 16px;
}

/* color grid */
.cg { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0; }
.cs {
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color .15s, transform .15s;
  position: relative;
}
.cs:hover { transform: scale(1.15); }
.cs.act {
  border-color: rgba(255,255,255,.8);
  box-shadow: 0 0 8px currentColor;
}

/* awareness toggle */
.awr { display: flex; gap: 8px; }
.awb {
  flex: 1;
  padding: 9px 12px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 10px;
  letter-spacing: 1px;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  transition: all .15s;
}
.awb:hover { color: var(--text); border-color: var(--border2); }
.awb.on-a  { background: #36d9b015; border-color: var(--teal); color: var(--teal); }
.awb.on-u  { background: #ff6b8a15; border-color: var(--rose); color: var(--rose); }

/* preset chips */
.presets-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.preset {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: .8px;
  text-transform: uppercase;

  border-radius: 14px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--soft);
